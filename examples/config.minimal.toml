# garm-provider-docker - minimal example config.
#
# This is the smallest file that produces a valid configuration: every key
# besides runner_image is optional and falls back to its default (see
# docs/config-reference.md).
#
# Result: dind_mode "none" (no DinD sidecar, no privileged container),
# docker_host = unix:///var/run/docker.sock, storage_driver = "overlay2",
# persistent caches enabled at their ADR-003 defaults, and
# [network].internal = false (job containers have normal internet egress).
#
# A test (internal/config/examples_test.go) loads this file with the real
# loader.

# Required: the runner image this provider creates job containers from.
# Must be pinned by a sha256 digest (name@sha256:<64-hex>) unless
# allow_unpinned_runner_image is set (dev-only escape hatch - never set it
# in a real deployment). Replace the placeholder digest below with the digest
# of ghcr.io/tzuh-hsu/garm-runner-noble that you resolve (see "Image digests"
# in runner-images/README.md) or with your own derived image.
runner_image = "ghcr.io/tzuh-hsu/garm-runner-noble@sha256:deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
