# Version updates only. Security updates are a repo-level GitHub setting and
# run regardless of this file's `schedule:`.
#
# Keys that also affect security PRs:
#   - `ignore:` must always carry `update-types:`. A bare `dependency-name:`
#     would also suppress security PRs for that dependency
#     (https://github.com/dependabot/dependabot-core/issues/4027).
#   - `commit-message:` prefixes security PRs too.
#   - `target-branch:` stays unset so the two keys above keep applying.
#   - `groups:` are limited to `applies-to: version-updates` so a security
#     fix is never batched behind an unrelated bump.
version: 2
updates:
  # Every `uses:` line is SHA-pinned with a trailing `# vX.Y.Z` comment.
  # Dependabot rewrites that comment together with the SHA, and needs it to
  # classify a bump as minor/patch versus major. Keep it on every `uses:` line.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        # Majors get their own PR. Inside a group the spelling is bare
        # `minor` / `patch`.
        update-types:
          - minor
          - patch

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/runner-images/noble"
      - "/runner-images/resolute"
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(deps)"
    groups:
      container-base-images:
        applies-to: version-updates
        patterns:
          - "*"
        # No `update-types:` filter: digest-only refreshes have no semver
        # type and would escape the group. Grouping is per directory.
    ignore:
      # go.mod is the single source of truth for the Go version. The
      # Dockerfile's `golang` tag is the one second copy, so bump it by hand
      # together with go.mod.
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    # The runner image pins are the manifest-list (index) digest, not a
    # single-platform digest, so the multi-platform build resolves the right
    # image per architecture. Dependabot preserves this; do not hand-replace
    # one with a platform-specific digest.

  # Exists only so a gomod security PR has a config entry to be rebased or
  # recreated from. `open-pull-requests-limit: 0` mutes version-update PRs;
  # security PRs are not subject to that limit. Raise the limit if gomod
  # version updates are ever wanted.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build(deps)"
