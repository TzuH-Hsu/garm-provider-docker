# Version updates only. Security updates are a repo-level GitHub setting and
# run regardless of this file's `schedule:`.
#
# Keys that also affect security PRs:
#   - `ignore:` must always carry `update-types:`. A bare `dependency-name:`
#     would also suppress security PRs for that dependency
#     (https://github.com/dependabot/dependabot-core/issues/4027).
#   - `commit-message:` prefixes security PRs too.
#   - `target-branch:` stays unset so the two keys above keep applying.
#   - `groups:` are limited to `applies-to: version-updates` so a security
#     fix is never batched behind an unrelated bump.
version: 2
updates:
  # Every `uses:` line is SHA-pinned with a trailing `# vX.Y.Z` comment.
  # Dependabot rewrites that comment together with the SHA, and needs it to
  # classify a bump as minor/patch versus major. Keep it on every `uses:` line.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        # Majors get their own PR. Inside a group the spelling is bare
        # `minor` / `patch`.
        update-types:
          - minor
          - patch

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/runner-images/noble"
      - "/runner-images/resolute"
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(deps)"
    groups:
      container-base-images:
        applies-to: version-updates
        patterns:
          - "*"
        # No `update-types:` filter: digest-only refreshes have no semver
        # type and would escape the group. Grouping is per directory.
    ignore:
      # go.mod's `toolchain` line is the single source of truth for the Go
      # version, and the Dockerfile's `golang` tag is its one second copy.
      # Renovate bumps both in one pull request (.github/renovate.json5), so
      # Dependabot must not move the tag alone; CI fails if they differ
      # (scripts/check-go-version.sh). A digest-only refresh of the pinned tag
      # has no semver type, so it cannot be ignored here. It stays with
      # Dependabot, and Renovate is set to skip it. To bump by hand when
      # Renovate is unavailable, see CONTRIBUTING.md.
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    # The runner image pins are the manifest-list (index) digest, not a
    # single-platform digest, so the multi-platform build resolves the right
    # image per architecture. Dependabot preserves this; do not hand-replace
    # one with a platform-specific digest.

  # Module requirements. This entry also gives gomod security PRs a config
  # entry to be rebased or recreated from.
  #   - Minor and patch bumps share one monthly PR. Majors get their own.
  #   - `cooldown` delays version updates only; security PRs are not held back.
  #   - `open-pull-requests-limit` caps version-update PRs only. Security PRs
  #     have a separate fixed limit.
  #   - github.com/docker/docker stays at v28.5.2+incompatible, the last
  #     version on its module path (see go.mod), so no update is expected.
  #   - A bump can raise go.mod's `go` line through `go get`, which changes
  #     language and GODEBUG defaults. scripts/check-go-version.sh then fails
  #     CI; do not accept that change without deciding to move the language
  #     version. The `toolchain` line is Renovate's, not Dependabot's.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    commit-message:
      prefix: "build(deps)"
    groups:
      go-modules:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
