# OpenSSF Scorecard: checks this repository's supply-chain practices and
# reports the results to code scanning and to the public Scorecard API.
#
# Publishing results imposes rules on this file, enforced by the API
# (https://github.com/ossf/scorecard-action#workflow-restrictions): no
# workflow- or job-level env or defaults, no workflow-level write
# permissions, an Ubuntu hosted runner, and only checkout, upload-artifact,
# upload-sarif and scorecard-action as steps. Keep `run:` steps out of it.
name: Scorecard

on:
  # Re-score when branch protection changes.
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 2'

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload results to code scanning.
      security-events: write
      # Sign the published results with GitHub's OIDC token.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Kept for five days, so a failed upload can still be inspected.
      - name: Upload results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
