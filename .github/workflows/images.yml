# M4-W1: builds and publishes this repo's two container images to GHCR.
#
# Four jobs, split by trigger and by which of them can reach GHCR at all:
#
#   On a pushed `v*` tag:
#   publish-build — matrix, one leg per image. Builds multi-arch and pushes
#     BY DIGEST ONLY: the image manifest lands in GHCR but no tag is moved,
#     so nothing a `docker pull <image>:<tag>` resolves changes yet. Each
#     leg hands its digest to publish-tag as a run artifact.
#   publish-tag — no matrix, `needs: publish-build`, so it only starts once
#     EVERY build leg has succeeded. Checks that both digests are present,
#     then points `<image>:<tag>` at them for both images. One failed build
#     therefore publishes nothing under a tag, instead of advancing one
#     image of the pair and not the other (#8). It never touches `:latest`.
#
#   On a GitHub release becoming a full (non-pre-release) release:
#   promote-latest — moves `<image>:latest` to `<image>:<tag>` for both
#     images. It runs on `release: released`, which fires when a full
#     release is published (including publishing release.yml's draft as
#     one) or when a published pre-release is changed to a full release.
#     A tag push alone therefore never moves `:latest` (#7): release.yml
#     turns the same tag into a DRAFT release, and `:latest` follows only
#     once a maintainer has reviewed it and made it a full release.
#
#   On workflow_dispatch:
#   dry-run — runs the exact same multi-arch build with `push: false`,
#     holds NO `packages` scope at all, and has no registry-login step to
#     skip in the first place.
#
# publish-build, publish-tag and promote-latest are the only jobs carrying
# `packages: write`. The first two are gated on
# `github.event_name == 'push' && github.ref_type == 'tag'`, promote-latest
# on `github.event_name == 'release'`, and dry-run on
# `github.event_name == 'workflow_dispatch'` — every job names the one
# event it runs for, so no trigger can fall through into another's job.
#
# Why promote-latest can rely on `release: released` firing at all:
# release.yml creates the draft with GITHUB_TOKEN, and per GitHub's docs
# ("Triggering a workflow from a workflow"), "events triggered by the
# `GITHUB_TOKEN` will not create a new workflow run" (the documented
# exceptions are workflow_dispatch, repository_dispatch, and some
# pull_request activity types). That rules out release.yml itself kicking
# off promote-latest. Publishing the draft, or changing a pre-release to
# a full release, is a maintainer's own action in the UI or API, not a
# GITHUB_TOKEN event, so it does start this workflow.
#
# Why `released` and not `published`: GitHub's webhook reference defines
# `published` as "A release, pre-release, or draft of a release was
# published." and `released` as "A release was published, or a
# pre-release was changed to a release." The `release` event docs add
# that to run "when stable *and* pre-releases publish, subscribe to
# `published` instead of `released` and `prereleased`" — `released` is
# the stable-only activity. So `released` alone covers both routes to a
# full release (a draft published as one, a pre-release promoted to one),
# fires once per promotion, and does not fire when a pre-release is
# published. promote-latest's `if:` still checks the payload's
# `prerelease` flag as defence in depth, so a pre-release cannot move
# `:latest` even if that reading of the docs ever stops holding.
#
# The push gate is deliberate and load-bearing: `workflow_dispatch`
# accepts a `--ref` of any kind, INCLUDING a tag (`gh workflow run --ref
# v1.2.3`), in which case `github.ref_type` is `tag` even though nothing
# was pushed. A job that keyed its login/push decision on `ref_type` alone
# would therefore publish from a manual invocation — breaking the dry-run
# promise. Requiring `event_name == 'push'` as well, and scoping
# `packages: write` to the publish jobs only, means there is no path by
# which a manual run can authenticate to or write to the registry: even if
# the `push` input were somehow forced true, the dispatch job's token has
# no packages scope to push with. For the same reason there is no
# dispatch path to promote-latest: moving `:latest` by hand means making
# the tag's GitHub release a full release, not running this workflow.
#
# No `pull_request` trigger: this workflow only ever runs against a ref that
# has already been reviewed and merged (a pushed tag), a release a
# maintainer made a full release, or an explicit manual invocation.
#
# Script-injection hygiene (same rationale as release.yml): git tag names
# are not restricted to a safe shell-metacharacter-free set, so
# $GITHUB_REF_NAME (GitHub's own built-in env var) and the release
# payload's tag_name are read as quoted shell variables inside `run:` steps
# below (the latter via `env:`), never spliced via `${{ }}` into script
# text, and each is checked against Docker's tag grammar before use.
# Values that end up in `with:` inputs to the pinned Docker actions
# (build-args) are not run through a shell at all.
name: Container Images

on:
  push:
    tags:
      - 'v*'
  release:
    types: [released]
  workflow_dispatch:

# For a `release` event, `github.ref` is the release's tag ref
# (`refs/tags/<tag_name>`, per the events-that-trigger-workflows docs) —
# the same ref the tag-push run for that tag had. Both runs therefore land
# in the same concurrency group, and with cancel-in-progress: false the
# promote run waits for a still-running publish run of the same tag rather
# than overlapping it. That is intended: publishing the draft early must
# not let promote-latest look for `:<tag>` before publish-tag has written
# it. Caveat: GitHub keeps at most one pending run per group by default,
# so a THIRD run for the same ref arriving while one is pending — e.g. a
# dry-run dispatched at that tag — cancels the pending one. The cancelled
# run shows up as such in the Actions tab and can be re-run from there.
concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Workflow-level default is read-only. `packages: write` is granted ONLY to
# the publish-build, publish-tag and promote-latest jobs below; the dry-run
# job explicitly holds none.
permissions:
  contents: read

jobs:
  # Real publish, stage 1 of 2: a pushed vX.Y.Z tag, and nothing else.
  # Pushes each image by digest; moves no tag.
  publish-build:
    name: publish-build (${{ matrix.name }})
    if: github.event_name == 'push' && github.ref_type == 'tag'
    # Stays on ubuntu-latest: multi-platform buildx/QEMU builds need a real
    # Docker daemon, which ubuntu-slim's container-only runtime cannot
    # provide (see ci.yml's dockerverify job comment for the same
    # constraint, and actions/runner-images#13541).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      # Still false here, on purpose: a failing leg can no longer publish a
      # half-release (publish-tag below never starts unless both legs
      # succeeded), so letting the other leg finish costs nothing and
      # surfaces every failure in one run instead of one per re-run.
      fail-fast: false
      matrix:
        include:
          # (a) the runner image (ADR-002): built from its own directory so
          # entrypoint.sh's relative COPY resolves the same way it does for
          # a local `docker build runner-images/noble`.
          - name: garm-runner-noble
            image: ghcr.io/tzuh-hsu/garm-runner-noble
            context: runner-images/noble
            dockerfile: runner-images/noble/Dockerfile
            needs_version_arg: false
          # (b) the provider binary image (plan.md M4 item 1): built from
          # the repo root so the root Dockerfile's `COPY . .` sees the
          # module.
          - name: garm-provider-docker
            image: ghcr.io/tzuh-hsu/garm-provider-docker
            context: .
            dockerfile: Dockerfile
            needs_version_arg: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A pushed vX.Y.Z tag IS the version — this job's `if:` guarantees
      # $GITHUB_REF_NAME is that tag, so there is no branching left to do.
      # It is checked against Docker's tag grammar (a leading `v<digit>`,
      # then only [A-Za-z0-9_.-]) HERE, before a long multi-arch build,
      # rather than letting publish-tag discover an untaggable name after
      # both images are already sitting in the registry. publish-tag reads
      # the same $GITHUB_REF_NAME in the same run and relies on this check.
      - name: Determine build metadata
        id: meta
        run: |
          version="${GITHUB_REF_NAME}"
          if ! [[ "${version}" =~ ^v[0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "::error::tag '${version}' is not a valid vX.Y.Z image tag"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance: mode=max / sbom: true match the dry-run job exactly
      # (verified locally: buildx generates both for a multi-platform build
      # even with push: false, so the dry run exercises the identical
      # attestation path a real release does).
      #
      # RULING (M4-W1, not to be revisited here): per-platform attestations
      # are accepted as-is; no cosign keyless signing is added. Known
      # quirk: for a multi-arch manifest LIST, provenance/SBOM attestations
      # are attached per-platform-manifest, not once for the top-level
      # index — a client that inspects the manifest list itself (rather
      # than resolving to one platform's digest first, or using the OCI
      # Referrers API) will not see a single combined attestation, and GHCR's
      # Referrers API support for discovering them by digest should be
      # verified against whatever tooling operators point at this image.
      #
      # Push by digest, no tags: the `outputs:` line is the image exporter
      # form from Docker's "distribute build across multiple runners"
      # workflow. Per Docker's image-exporter reference, `push-by-digest`
      # means "Push image without name" (no tag is written) and
      # `name-canonical` adds the "canonical name `name@<digest>`".
      # The action's `push:` input is left unset on purpose: it is only
      # shorthand for `--output=type=registry`, and would add a second
      # output alongside this one. The attestations are unaffected by
      # pushing by digest — BuildKit stores them as manifests inside the
      # image index itself (Docker's attestation-storage docs: "Attestations
      # are stored as manifest objects in the image index."), and
      # `steps.build.outputs.digest` is that index's digest, so tagging it
      # later tags the attestations along with the platform images.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: ${{ matrix.needs_version_arg && format('VERSION={0}', steps.meta.outputs.version) || '' }}
          provenance: mode=max
          sbom: true

      # One file per image, named after the image and holding its digest,
      # so publish-tag can check for each image by name rather than infer
      # completeness from a file count.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build step returned no usable digest for ${NAME}: '${DIGEST}'"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/digests/${NAME}"

      # overwrite: true for the same reason, and with the same caveat, as
      # release.yml's "Upload binary artifact" step: artifacts are scoped
      # to the run, not the attempt, so a "Re-run all jobs" is inferred
      # (not yet reproduced) to fail re-uploading a name attempt 1 already
      # created. By the same run scoping, "Re-run failed jobs" after one
      # failed leg should rebuild only that leg and let publish-tag pick up
      # the other leg's digest from the earlier attempt.
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.name }}
          path: ${{ runner.temp }}/digests/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Real publish, stage 2 of 2. `needs: publish-build` means this job is
  # skipped unless every matrix leg above succeeded, so a tag only ever
  # moves once BOTH images exist. `docker buildx imagetools create` with a
  # single image-index source re-pushes that index's original bytes under
  # the new tag (buildx util/imagetools/create.go: "on single source,
  # return original bytes"), so `<image>:<tag>` resolves to exactly the
  # digest built above, attestations included, with nothing rebuilt.
  #
  # Honest limit: a registry has no multi-tag transaction, so the tag
  # writes below are still sequential. What this job guarantees is that
  # none of them starts until both images are built and both digests are
  # in hand; if a tag write itself fails part-way, re-running this job
  # re-applies every tag to the same digests.
  publish-tag:
    name: publish-tag
    needs: publish-build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    # `docker buildx` needs a Docker daemon for setup-buildx-action's
    # builder, which ubuntu-slim cannot provide (see publish-build).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Two passes over the same fixed image list: the first only reads and
      # checks, so a missing or malformed digest fails the job before a
      # single tag is written. $GITHUB_REF_NAME was validated against the
      # tag grammar by publish-build in this same run.
      - name: Tag both images
        run: |
          version="${GITHUB_REF_NAME}"
          dir="${RUNNER_TEMP}/digests"
          images=(
            ghcr.io/tzuh-hsu/garm-runner-noble
            ghcr.io/tzuh-hsu/garm-provider-docker
          )

          for image in "${images[@]}"; do
            file="${dir}/${image##*/}"
            if [ ! -s "${file}" ]; then
              echo "::error::no digest artifact for ${image}; refusing to tag either image"
              exit 1
            fi
            digest="$(cat "${file}")"
            if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::malformed digest for ${image}: '${digest}'"
              exit 1
            fi
          done

          for image in "${images[@]}"; do
            digest="$(cat "${dir}/${image##*/}")"
            echo "Tagging ${image}@${digest} as :${version}"
            docker buildx imagetools create \
              -t "${image}:${version}" \
              "${image}@${digest}"
          done

  # Moves `:latest` for both images to the release's `:<tag>` when that
  # GitHub release becomes a full release: its draft is published as a
  # non-pre-release, or an already-published pre-release is changed to a
  # full release. Both routes fire `release: released` (see the file
  # header for why that activity, why it fires here at all, and why the
  # `prerelease` check in `if:` is kept anyway). Publishing a pre-release
  # does not move `:latest`; promoting that pre-release later does.
  # Nothing is built or checked out: both `:<tag>` images must already
  # exist from the tag-push run, and this job refuses to move either
  # `:latest` unless BOTH do, so the pair can never end up split across
  # releases.
  promote-latest:
    name: promote-latest
    if: github.event_name == 'release' && !github.event.release.prerelease
    # setup-buildx-action's builder needs a Docker daemon, which
    # ubuntu-slim cannot provide (see publish-build).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No checkout, so no `contents` scope is needed; `packages: write` is
    # the only thing this job does with its token.
    permissions:
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      # Before any registry contact: the tag must look like a release
      # version and be a valid Docker tag. Same grammar publish-build
      # enforces on the tag-push side.
      - name: Validate release tag
        run: |
          if ! [[ "${TAG}" =~ ^v[0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "::error::release tag '${TAG}' is not a valid vX.Y.Z image tag"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Two passes, as in publish-tag: every `:<tag>` is confirmed to exist
      # before any `:latest` is written. A single image-index source is
      # re-pushed byte for byte, so `:latest` ends up at exactly the
      # digest `:<tag>` points to.
      - name: Promote both images to latest
        run: |
          images=(
            ghcr.io/tzuh-hsu/garm-runner-noble
            ghcr.io/tzuh-hsu/garm-provider-docker
          )

          for image in "${images[@]}"; do
            if ! docker buildx imagetools inspect "${image}:${TAG}" > /dev/null; then
              echo "::error::${image}:${TAG} not found or not readable; refusing to move :latest on either image"
              exit 1
            fi
          done

          for image in "${images[@]}"; do
            echo "Moving ${image}:latest to ${image}:${TAG}"
            docker buildx imagetools create \
              -t "${image}:latest" \
              "${image}:${TAG}"
          done

  # Dry run: `workflow_dispatch`, including a dispatch aimed at a tag ref.
  # Builds only. It holds no `packages` scope, performs no registry login,
  # and passes `push: false`, so there is no path from here to GHCR.
  dry-run:
    name: dry-run (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch'
    # Stays on ubuntu-latest: same buildx/QEMU Docker requirement as the
    # publish-build job above; ubuntu-slim cannot run a Docker daemon.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: none
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: garm-runner-noble
            image: ghcr.io/tzuh-hsu/garm-runner-noble
            context: runner-images/noble
            dockerfile: runner-images/noble/Dockerfile
            needs_version_arg: false
          - name: garm-provider-docker
            image: ghcr.io/tzuh-hsu/garm-provider-docker
            context: .
            dockerfile: Dockerfile
            needs_version_arg: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A synthetic version that can never collide with a real release tag,
      # while still exercising the identical build-arg/-ldflags path. The
      # ref name is deliberately NOT consulted here: a dispatch may point at
      # a tag, and treating that as a release version is exactly the
      # confusion this job's separation exists to prevent.
      - name: Determine build metadata
        id: meta
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          version="v0.0.0-dryrun-${GITHUB_SHA::12}"
          {
            echo "version=${version}"
            echo "tags=${IMAGE}:${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ matrix.needs_version_arg && format('VERSION={0}', steps.meta.outputs.version) || '' }}
          provenance: mode=max
          sbom: true

      - name: Dry-run summary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Container image dry run"
            echo
            echo "No registry login was performed and nothing was pushed."
            echo "This job holds no \`packages\` permission."
            echo
            echo "- Synthetic version: \`${VERSION}\`"
            echo "- Tag that WOULD have been built: \`${TAGS}\`"
            echo "- A pushed \`v*\` tag pushes both images by digest, then tags"
            echo "  \`<image>:<tag>\` only after both built. \`<image>:latest\` moves"
            echo "  only when the GitHub release for that tag becomes a full"
            echo "  (non-pre-release) release."
          } >> "$GITHUB_STEP_SUMMARY"
