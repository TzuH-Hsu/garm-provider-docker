# Builds and publishes the runner images and the provider binary image to GHCR.
#
# On a pushed `v*` tag, publish-build pushes each image by digest only (no tag
# moves), and publish-tag, which needs every build leg, then tags all images.
# promote-latest moves `:latest` when a release becomes a full release, so a
# tag push alone never does; release.yml creates a draft and a maintainer
# publishes it. dry-run (workflow_dispatch) builds with `push: false`, no
# `packages` scope and no registry login.
#
# Every job's `if:` names the one event it runs for. Publish jobs check
# `event_name == 'push'` as well as `ref_type == 'tag'`, because
# `workflow_dispatch` accepts a tag as `--ref`.
#
# promote-latest uses `release: released`, which fires when a draft is
# published as a full release or a pre-release is promoted, not when a
# pre-release is published. Releases created with GITHUB_TOKEN do not start
# workflows, so publishing the draft by hand is what triggers it. Its `if:`
# also checks `prerelease` as a second guard.
#
# Tag names are not shell-safe: $GITHUB_REF_NAME and the release's tag_name
# are read as quoted shell variables (the latter via `env:`), never spliced
# with `${{ }}`, and are checked against Docker's tag grammar first.
name: Container Images

on:
  push:
    tags:
      - 'v*'
  release:
    types: [released]
  workflow_dispatch:

# The release event and the tag push share a ref, so promote-latest waits for
# a running publish-tag instead of looking for `:<tag>` before it exists. A
# third run on the same ref cancels the pending one; re-run it if so.
concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Stage 1 of 2: pushes each image by digest and moves no tag.
  publish-build:
    name: publish-build (${{ matrix.name }})
    if: github.event_name == 'push' && github.ref_type == 'tag'
    # Not ubuntu-slim: buildx needs a Docker daemon (actions/runner-images#13541).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      # publish-tag needs every leg, so let the others finish and surface all
      # failures in one run.
      fail-fast: false
      matrix:
        include:
          # Runner images use runner-images/ as context for the shared entrypoint.
          - name: garm-runner-noble
            image: ghcr.io/tzuh-hsu/garm-runner-noble
            context: runner-images
            dockerfile: runner-images/noble/Dockerfile
            needs_version_arg: false
          - name: garm-runner-resolute
            image: ghcr.io/tzuh-hsu/garm-runner-resolute
            context: runner-images
            dockerfile: runner-images/resolute/Dockerfile
            needs_version_arg: false
          - name: garm-provider-docker
            image: ghcr.io/tzuh-hsu/garm-provider-docker
            context: .
            dockerfile: Dockerfile
            needs_version_arg: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Validate the tag before the long build, not after the push.
      - name: Determine build metadata
        id: meta
        run: |
          version="${GITHUB_REF_NAME}"
          if ! [[ "${version}" =~ ^v[0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "::error::tag '${version}' is not a valid vX.Y.Z image tag"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `push-by-digest` writes the image without a tag. `push:` stays unset
      # because it would add a second registry output. The digest is the
      # image index's, so it covers the attestations (attached per platform
      # manifest, not once on the index).
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: ${{ matrix.needs_version_arg && format('VERSION={0}', steps.meta.outputs.version) || '' }}
          provenance: mode=max
          sbom: true

      # One file per image, so publish-tag can check each by name.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build step returned no usable digest for ${NAME}: '${DIGEST}'"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/digests/${NAME}"

      # overwrite: true so a re-run can re-upload (see release.yml).
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: ${{ runner.temp }}/digests/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Stage 2 of 2. `imagetools create` from one index source re-pushes the
  # original bytes, so `<image>:<tag>` is exactly the built digest. Tag writes
  # are sequential; if one fails, re-running re-applies every tag.
  publish-tag:
    name: publish-tag
    needs: publish-build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    # Not ubuntu-slim: buildx needs a Docker daemon.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The first pass only checks, so nothing is tagged on a bad digest. The
      # list must name every publish-build matrix leg.
      - name: Tag every image
        run: |
          version="${GITHUB_REF_NAME}"
          dir="${RUNNER_TEMP}/digests"
          images=(
            ghcr.io/tzuh-hsu/garm-runner-noble
            ghcr.io/tzuh-hsu/garm-runner-resolute
            ghcr.io/tzuh-hsu/garm-provider-docker
          )

          for image in "${images[@]}"; do
            file="${dir}/${image##*/}"
            if [ ! -s "${file}" ]; then
              echo "::error::no digest artifact for ${image}; refusing to tag any image"
              exit 1
            fi
            digest="$(cat "${file}")"
            if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::malformed digest for ${image}: '${digest}'"
              exit 1
            fi
          done

          for image in "${images[@]}"; do
            digest="$(cat "${dir}/${image##*/}")"
            echo "Tagging ${image}@${digest} as :${version}"
            docker buildx imagetools create \
              -t "${image}:${version}" \
              "${image}@${digest}"
          done

  # Moves `:latest` to `:<tag>` for every image, only if all `:<tag>` exist.
  promote-latest:
    name: promote-latest
    if: github.event_name == 'release' && !github.event.release.prerelease
    # Not ubuntu-slim: buildx needs a Docker daemon.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No checkout, so no `contents` scope.
    permissions:
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      # Same tag grammar as publish-build.
      - name: Validate release tag
        run: |
          if ! [[ "${TAG}" =~ ^v[0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "::error::release tag '${TAG}' is not a valid vX.Y.Z image tag"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Check every `:<tag>` before writing any `:latest`.
      - name: Promote every image to latest
        run: |
          images=(
            ghcr.io/tzuh-hsu/garm-runner-noble
            ghcr.io/tzuh-hsu/garm-runner-resolute
            ghcr.io/tzuh-hsu/garm-provider-docker
          )

          for image in "${images[@]}"; do
            if ! docker buildx imagetools inspect "${image}:${TAG}" > /dev/null; then
              echo "::error::${image}:${TAG} not found or not readable; refusing to move :latest on any image"
              exit 1
            fi
          done

          for image in "${images[@]}"; do
            echo "Moving ${image}:latest to ${image}:${TAG}"
            docker buildx imagetools create \
              -t "${image}:latest" \
              "${image}:${TAG}"
          done

  # Builds only, with no `packages` scope and no registry login.
  dry-run:
    name: dry-run (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch'
    # Not ubuntu-slim: buildx needs a Docker daemon.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: none
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: garm-runner-noble
            image: ghcr.io/tzuh-hsu/garm-runner-noble
            context: runner-images
            dockerfile: runner-images/noble/Dockerfile
            needs_version_arg: false
          - name: garm-runner-resolute
            image: ghcr.io/tzuh-hsu/garm-runner-resolute
            context: runner-images
            dockerfile: runner-images/resolute/Dockerfile
            needs_version_arg: false
          - name: garm-provider-docker
            image: ghcr.io/tzuh-hsu/garm-provider-docker
            context: .
            dockerfile: Dockerfile
            needs_version_arg: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Synthetic version; the ref is ignored because a dispatch may be a tag.
      - name: Determine build metadata
        id: meta
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          version="v0.0.0-dryrun-${GITHUB_SHA::12}"
          {
            echo "version=${version}"
            echo "tags=${IMAGE}:${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ matrix.needs_version_arg && format('VERSION={0}', steps.meta.outputs.version) || '' }}
          provenance: mode=max
          sbom: true

      - name: Dry-run summary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Container image dry run"
            echo
            echo "No registry login was performed and nothing was pushed."
            echo "This job holds no \`packages\` permission."
            echo
            echo "- Synthetic version: \`${VERSION}\`"
            echo "- Tag that WOULD have been built: \`${TAGS}\`"
            echo "- A pushed \`v*\` tag pushes every image by digest, then tags"
            echo "  \`<image>:<tag>\` only after all built. \`<image>:latest\` moves"
            echo "  only when the GitHub release for that tag becomes a full"
            echo "  (non-pre-release) release."
          } >> "$GITHUB_STEP_SUMMARY"
