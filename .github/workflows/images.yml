# M4-W1: builds and publishes this repo's two container images to GHCR.
#
# Triggered ONLY by version tags (`v*`) — a normal release, tagged with the
# tag itself plus `latest` — or manually via `workflow_dispatch`, which is
# the dry-run path: it runs the exact same multi-arch build but with
# `push: false`, so nothing ever reaches GHCR. No `pull_request` trigger:
# this workflow only ever runs against a ref that has already been reviewed
# and merged (a pushed tag) or an explicit manual invocation.
#
# Script-injection hygiene (same rationale as release.yml): git tag names
# are not restricted to a safe shell-metacharacter-free set, so
# $GITHUB_REF_NAME/$GITHUB_REF_TYPE (GitHub's own built-in env vars) are
# read as quoted shell variables inside `run:` steps below, never spliced
# via `${{ }}` into script text. Values that end up in `with:` inputs to the
# pinned Docker actions (image tags, build-args) are not run through a
# shell at all, and Docker's own tag-name validation rejects anything a
# malicious ref could smuggle in there regardless.
name: Container Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # (a) the runner image (ADR-002): built from its own directory so
          # entrypoint.sh's relative COPY resolves the same way it does for
          # a local `docker build runner-images/noble`.
          - name: garm-runner-noble
            image: ghcr.io/tzuh-hsu/garm-runner-noble
            context: runner-images/noble
            dockerfile: runner-images/noble/Dockerfile
            needs_version_arg: false
          # (b) the provider binary image (plan.md M4 item 1): built from
          # the repo root so the root Dockerfile's `COPY . .` sees the
          # module.
          - name: garm-provider-docker
            image: ghcr.io/tzuh-hsu/garm-provider-docker
            context: .
            dockerfile: Dockerfile
            needs_version_arg: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # A pushed vX.Y.Z tag IS the version, and the only trigger that
      # actually pushes. workflow_dispatch (dry run) gets a synthetic
      # version and push=false. "tags" is written via the GITHUB_OUTPUT
      # heredoc form to carry a real newline (this repo's convention for
      # multi-line step outputs) rather than being reconstructed later with
      # `${{ }}` splicing.
      - name: Determine build metadata
        id: meta
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            push=true
            # printf, not a quoted multi-line string literal, so no YAML
            # indentation whitespace ends up baked into the second line.
            tags="$(printf '%s:%s\n%s:latest' "${IMAGE}" "${version}" "${IMAGE}")"
          else
            version="v0.0.0-dryrun+${GITHUB_SHA::12}"
            push=false
            tags="${IMAGE}:${version}"
          fi
          {
            echo "version=${version}"
            echo "push=${push}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Only log in when this run will actually push — a dry run needs no
      # registry credentials at all.
      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance: mode=max / sbom: true are unconditional (verified
      # locally: buildx happily generates both for a multi-platform build
      # even with push: false, so the dry run exercises the identical
      # attestation path a real release does).
      #
      # RULING (M4-W1, not to be revisited here): per-platform attestations
      # are accepted as-is; no cosign keyless signing is added. Known
      # quirk: for a multi-arch manifest LIST, provenance/SBOM attestations
      # are attached per-platform-manifest, not once for the top-level
      # index — a client that inspects the manifest list itself (rather
      # than resolving to one platform's digest first, or using the OCI
      # Referrers API) will not see a single combined attestation, and GHCR's
      # Referrers API support for discovering them by digest should be
      # verified against whatever tooling operators point at this image.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ matrix.needs_version_arg && format('VERSION={0}', steps.meta.outputs.version) || '' }}
          provenance: mode=max
          sbom: true
