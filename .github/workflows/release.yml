# M4-W1: builds and publishes static release binaries.
#
# Triggered ONLY by version tags (`v*`) — a normal release — or manually via
# `workflow_dispatch`, which exercises the exact same build+checksum steps
# as a dry run: it builds and hashes the binaries but never creates or
# publishes a GitHub Release (see the `release` job's `if:` conditions
# below). No `pull_request` trigger: this workflow only ever runs against a
# ref that has already been reviewed and merged (a pushed tag) or an
# explicit manual invocation — never against untrusted PR content.
#
# Script-injection hygiene: git tag/ref names are NOT restricted to a safe
# shell-metacharacter-free set (git's own ref-format rules permit `$`,
# backticks, parens, etc.), so every value derived from `github.ref_name` /
# `github.ref_type` below is passed into `run:` steps via `env:` (or
# GitHub's own $GITHUB_REF_NAME/$GITHUB_REF_TYPE) and referenced as a quoted
# shell variable — never spliced directly into a script via `${{ }}` — so a
# maliciously named tag can never become a command in this job's shell.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# A superseded run on the SAME tag/ref is still allowed to finish rather
# than being cancelled mid-build — unlike ci.yml's cancel-in-progress, a
# half-finished release build/upload is worse than a slightly redundant one.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go.mod is this repo's single source of truth for the Go version;
      # release builds must never drift from it by hardcoding a version here
      # (same technique as ci.yml).
      - name: Read Go version from go.mod
        id: goversion
        run: echo "version=$(grep -m1 '^go ' go.mod | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.goversion.outputs.version }}

      # A pushed vX.Y.Z tag IS the version. workflow_dispatch (the dry-run
      # path) has no tag, so it gets a synthetic version that can never
      # collide with a real release tag, but still exercises the exact same
      # -ldflags injection path. $GITHUB_REF_NAME/$GITHUB_REF_TYPE are
      # GitHub Actions' own built-in env vars (equal to github.ref_name /
      # github.ref_type) — read here as shell variables, never spliced via
      # `${{ }}`, so a crafted tag name cannot inject shell commands.
      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="v0.0.0-dryrun+${GITHUB_SHA::12}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Static cross-compile: CGO_ENABLED=0 plus this repo's pure-Go
      # dependency set (no cgo / `import "C"` anywhere in the tree) means
      # the resulting binary has no libc dependency on either target. The
      # -ldflags -X path below targets the exact variable
      # internal/version/version.go documents as its build-time injection
      # point. VERSION is passed via env (not `${{ }}` splicing) since it
      # may carry an attacker-influenceable tag name — see the file-level
      # comment above.
      - name: Build static binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          out="dist/garm-provider-docker_${VERSION}_${GOOS}_${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/TzuH-Hsu/garm-provider-docker/internal/version.Version=${VERSION}" \
            -o "${out}" .
          chmod +x "${out}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: checksum and publish
    needs: build
    runs-on: ubuntu-latest
    # Only this job needs write access, and only to create the draft
    # release below — the build job above stays read-only.
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Compute SHA256SUMS
        working-directory: dist
        run: |
          ls -la
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="v0.0.0-dryrun+${GITHUB_SHA::12}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Real release: only on a pushed vX.Y.Z tag. `gh release create` (the
      # GitHub CLI, preinstalled on every GitHub-hosted runner) is used
      # directly instead of a third-party release action: it needs no extra
      # SHA pin, is maintained by GitHub itself, and this workflow's needs
      # (a draft release with file attachments) are exactly its job — no
      # goreleaser config to maintain for two static binaries plus a
      # checksum file. `--draft` so the owner reviews and publishes
      # manually; nothing here makes the release public. VERSION is passed
      # via env, not `${{ }}` splicing — see the file-level comment above.
      - name: Create draft GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${VERSION}" \
            --draft \
            --generate-notes

      # workflow_dispatch dry run: prove the build + checksum steps work
      # end to end without creating or touching anything on GitHub.
      - name: Dry-run summary (workflow_dispatch)
        if: github.ref_type != 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Dry run (workflow_dispatch): no GitHub Release created."
          echo "Version that would have been used: ${VERSION}"
          echo "Artifacts that would have been attached:"
          ls -la dist
