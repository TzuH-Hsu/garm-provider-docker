# Builds static release binaries for version tags (`v*`). A manual
# `workflow_dispatch` is a dry run: it builds and hashes but never creates a
# release. There is no `pull_request` trigger.
#
# The release gate is `event_name == 'push' && ref_type == 'tag'`, not
# `ref_type` alone: `workflow_dispatch` accepts a tag as `--ref`
# (`gh workflow run --ref v1.2.3`), which sets ref_type=tag without a push.
# `contents: write` is scoped to the publish job as a second guard.
#
# Tag names are not shell-safe. Values derived from them go into `run:` steps
# via `env:` or $GITHUB_REF_NAME as quoted variables, never via `${{ }}`.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Let a superseded run finish rather than leave a half-uploaded release.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    # ubuntu-slim is enough: a pure-Go cross-compile needs no Docker.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go.mod is the single source of truth for the Go version. setup-go
      # installs its `toolchain` line when there is one, else the `go` line.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Fails the release build if the installed Go is not the toolchain that
      # go.mod names, so a binary is never built with a different Go silently.
      - name: Check Go version matches go.mod and Dockerfile
        run: |
          go version
          scripts/check-go-version.sh

      # A pushed tag is the version. Anything else, including a dispatch
      # aimed at a tag, gets a synthetic one. IS_RELEASE matches the publish
      # job's predicate.
      - name: Determine version
        id: version
        env:
          IS_RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        run: |
          if [ "${IS_RELEASE}" = "true" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="v0.0.0-dryrun+${GITHUB_SHA::12}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # CGO_ENABLED=0 gives a binary with no libc dependency.
      - name: Build static binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          out="dist/garm-provider-docker_${VERSION}_${GOOS}_${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/TzuH-Hsu/garm-provider-docker/internal/version.Version=${VERSION}" \
            -o "${out}" .
          chmod +x "${out}"

      # overwrite: true because artifacts are scoped to the run, not the
      # attempt, so a re-run would otherwise fail re-uploading the same name.
      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # The only job with `contents: write`.
  publish:
    name: checksum and publish
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Compute SHA256SUMS
        working-directory: dist
        run: |
          ls -la
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # A tag with a hyphen (e.g. `v0.2.0-rc.1`) becomes a pre-release draft.
      # `:latest` moves only once it is a full release (see images.yml), so an
      # `-rc` tag rehearses the publish path. The draft is for maintainer review.
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "${VERSION}" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "${VERSION}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${VERSION}" \
            --draft \
            "${prerelease[@]}" \
            --generate-notes

  # Every trigger that is not a pushed tag. `contents: read` only.
  dry-run:
    name: checksum dry run
    needs: build
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Compute SHA256SUMS
        working-directory: dist
        run: |
          ls -la
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Dry-run summary
        run: |
          {
            echo "### Release dry run"
            echo
            echo "No GitHub Release was created; nothing was written remotely."
            echo "This job holds \`contents: read\` only."
            echo
            echo "Artifacts that WOULD have been attached to a draft release:"
            echo
            echo '```'
            ls -1 dist
            echo '```'
            echo
            echo "SHA256SUMS:"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
