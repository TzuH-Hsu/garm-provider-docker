<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><title>Architecture</title><desc>GitHub sends jobs to GARM, GARM runs the provider, and the provider creates one isolated set of Docker resources per job on a single host.</desc><rect x="20" y="135" width="130" height="70" rx="8" fill="none" stroke="#EEF1F4" stroke-width="1.5"/><text x="85.0" y="166.0" text-anchor="middle" font-size="15" font-weight="600" fill="#EEF1F4">GitHub</text><text x="85.0" y="185.0" text-anchor="middle" font-size="12" fill="#9AA4AE">Actions jobs</text><path d="M150 170H196" stroke="#EEF1F4" stroke-width="1.5" fill="none"/><path d="M189 165L196 170L189 175" stroke="#EEF1F4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="200" y="135" width="130" height="70" rx="8" fill="none" stroke="#EEF1F4" stroke-width="1.5"/><text x="265.0" y="166.0" text-anchor="middle" font-size="15" font-weight="600" fill="#EEF1F4">GARM</text><text x="265.0" y="185.0" text-anchor="middle" font-size="12" fill="#9AA4AE">decides when</text><path d="M330 170H376" stroke="#EEF1F4" stroke-width="1.5" fill="none"/><path d="M369 165L376 170L369 175" stroke="#EEF1F4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="380" y="135" width="140" height="70" rx="8" fill="none" stroke="#EEF1F4" stroke-width="1.5"/><text x="450.0" y="166.0" text-anchor="middle" font-size="15" font-weight="600" fill="#EEF1F4">Provider</text><text x="450.0" y="185.0" text-anchor="middle" font-size="12" fill="#9AA4AE">creates and removes</text><path d="M520 170H566" stroke="#EEF1F4" stroke-width="1.5" fill="none"/><path d="M559 165L566 170L559 175" stroke="#EEF1F4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="570" y="14" width="370" height="312" rx="10" fill="none" stroke="#EEF1F4" stroke-width="2"/><text x="590" y="42" font-size="15" font-weight="600" fill="#EEF1F4">Docker host</text><rect x="590" y="54" width="330" height="136" rx="8" fill="#1B222C" stroke="#F5B82E" stroke-width="2"/><text x="604" y="76" font-size="13" fill="#EEF1F4">One job: its own network, removed together</text><rect x="604" y="88" width="146" height="44" rx="8" fill="#F5B82E" stroke="#F5B82E" stroke-width="1.5"/><text x="677.0" y="115.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0D1117">Runner</text><rect x="760" y="88" width="146" height="44" rx="8" fill="none" stroke="#EEF1F4" stroke-width="1.5" stroke-dasharray="5 4"/><text x="833.0" y="115.0" text-anchor="middle" font-size="15" font-weight="600" fill="#EEF1F4">DinD (optional)</text><rect x="604" y="142" width="302" height="36" rx="8" fill="none" stroke="#EEF1F4" stroke-width="1.5"/><text x="755.0" y="165.0" text-anchor="middle" font-size="15" font-weight="600" fill="#EEF1F4">Job volumes</text><rect x="590" y="202" width="330" height="42" rx="8" fill="none" stroke="#EEF1F4" stroke-width="1.5" stroke-dasharray="5 4"/><text x="755.0" y="228.0" text-anchor="middle" font-size="15" font-weight="600" fill="#EEF1F4">Next job: a fresh set</text><rect x="590" y="256" width="330" height="54" rx="8" fill="#1B222C" stroke="#1B222C" stroke-width="1.5"/><text x="755.0" y="279.0" text-anchor="middle" font-size="15" font-weight="600" fill="#EEF1F4">Repository caches</text><text x="755.0" y="298.0" text-anchor="middle" font-size="12" fill="#9AA4AE">kept across jobs</text></svg>
